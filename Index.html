<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA AI - المساعد الذكي الشامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --accent-orange: #ff5e62;
            --accent-blue: #00c6ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 300px; background: var(--bg-card); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; gap: 20px; }
        .logo-container { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 900; background: linear-gradient(45deg, var(--accent-orange), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .memory-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        .memory-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { background: rgba(0, 198, 255, 0.15); color: var(--accent-blue); border: 1px solid rgba(0, 198, 255, 0.3); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }

        /* Chat Main */
        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
        .chat-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 0.95rem; overflow-wrap: anywhere; }
        .message.user { align-self: flex-start; background: linear-gradient(135deg, var(--accent-orange), #ff9966); color: #fff; border-bottom-right-radius: 2px; }
        .message.bot { align-self: flex-end; background: var(--bg-card); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }

        /* Controls */
        .input-area { padding: 20px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; }
        .input-area input { flex: 1; min-width: 0; background: var(--bg-main); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 10px; color: #fff; outline: none; }
        .btn { background: linear-gradient(45deg, var(--accent-orange), var(--accent-blue)); border: none; color: #fff; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { opacity: 0.9; }
        .btn-icon { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Image studio (from the second file) */
        .image-panel { padding: 15px 20px; background: #0b1220; border-top: 1px solid var(--border-color); }
        .image-panel[hidden] { display: none; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 800; }
        .close { background: none; border: 0; color: var(--text-muted); cursor: pointer; font-size: 18px; }
        .field-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 12px; color: var(--text-muted); }
        .field input, .field select { width: 100%; background: #172235; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; font-size: 14px; outline: none; }
        .field input:focus, .field select:focus { border-color: rgba(0, 198, 255, 0.5); }
        .generate-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
        .fineprint { font-size: 11px; color: #8190a5; line-height: 1.6; }
        .art { display: block; width: 100%; max-width: 620px; border-radius: 14px; margin-top: 12px; border: 1px solid var(--border-color); background: #0b1220; }
        .art-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .small-btn { border: 1px solid var(--border-color); background: rgba(255,255,255,0.04); color: #dce7f5; border-radius: 9px; padding: 7px 11px; text-decoration: none; font-size: 13px; cursor: pointer; }
        .loading { display: flex; align-items: center; gap: 10px; color: #aebbd0; }
        .spinner { width: 17px; height: 17px; border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .message { max-width: 92%; }
            .field-grid { grid-template-columns: 1fr 1fr; }
            .field:first-child { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-container">
            <i class="fa-solid fa-brain"></i>
            <span>AURA AI</span>
        </div>
        <div class="memory-box">
            <div class="memory-title">
                <i class="fa-solid fa-address-book"></i>
                <span>ذاكرة الأسماء والكيانات</span>
            </div>
            <div class="tags-container" id="memoryTags">
                <span class="tag">تاجو</span>
                <span class="tag">عمر</span>
                <span class="tag">عبد الرحمن</span>
            </div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <h3>المساعد الذكي AURA</h3>
            <span style="color: var(--accent-blue); font-size: 0.85rem;">● متصل ومستعد</span>
        </div>

        <div class="chat-messages" id="chatContainer">
            <div class="message bot">
                مرحباً بك! أنا **AURA** مساعدك الذكي. يمكنك التحدث معي، طلب توليد الصور، أو ذكر أي أسماء وسيتم التعرف عليها محلياً تلقائياً!
            </div>
        </div>

        <div class="image-panel" id="imagePanel" hidden>
            <div class="panel-head">
                <span><i class="fa-solid fa-wand-magic-sparkles"></i> استوديو توليد الصور</span>
                <button class="close" onclick="toggleStudio(false)" aria-label="إغلاق">×</button>
            </div>
            <div class="field-grid">
                <div class="field"><label for="imagePrompt">وصف الصورة</label><input id="imagePrompt" placeholder="مثال: فارس عربي في صحراء وقت الغروب، أسلوب سينمائي"></div>
                <div class="field"><label for="style">النمط الفني</label>
                    <select id="style">
                        <option value="cinematic, highly detailed">سينمائي واقعي</option>
                        <option value="photorealistic">واقعي جداً</option>
                        <option value="anime illustration">أنمي</option>
                        <option value="3D render, detailed">ثلاثي الأبعاد</option>
                        <option value="digital painting">رسم رقمي</option>
                        <option value="watercolor painting">ألوان مائية</option>
                        <option value="minimalist graphic design">تصميم بسيط</option>
                    </select></div>
                <div class="field"><label for="ratio">أبعاد الصورة</label>
                    <select id="ratio">
                        <option value="1:1">مربع 1:1</option>
                        <option value="16:9">عريض 16:9</option>
                        <option value="9:16">طولي 9:16</option>
                        <option value="4:3">4:3</option>
                        <option value="3:2">3:2</option>
                    </select></div>
            </div>
            <div class="generate-row">
                <span class="fineprint">توليد الصور يتم عبر خدمة خارجية وقد يستغرق بعض الوقت.</span>
                <button class="btn" onclick="generateFromPanel()"><i class="fa-solid fa-wand-magic-sparkles"></i> أنشئ الصورة</button>
            </div>
        </div>

        <div class="input-area">
            <button class="btn-icon" title="استوديو الصور" onclick="toggleStudio()"><i class="fa-solid fa-image"></i></button>
            <input type="text" id="userInput" placeholder="اكتب رسالتك أو صف الصورة التي تريدها..." onkeypress="handleKey(event)">
            <button class="btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const entities = new Set(["تاجو", "عمر", "عبد الرحمن"]);

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function extractEntities(text) {
            text.split(" ").forEach(word => {
                if (["تاجو", "عمر", "عبدالرحمن", "عبد الرحمن", "سارة", "محمد", "علي"].includes(word)) {
                    entities.add(word);
                    updateMemoryUI();
                }
            });
        }

        function updateMemoryUI() {
            const container = $("memoryTags");
            container.innerHTML = "";
            entities.forEach(name => {
                const tag = document.createElement("span");
                tag.className = "tag";
                tag.innerText = name;
                container.appendChild(tag);
            });
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            $("chatContainer").appendChild(msgDiv);
            msgDiv.scrollIntoView({ behavior: "smooth", block: "end" });
            return msgDiv;
        }

        function sendMessage() {
            const input = $("userInput");
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            extractEntities(text);
            input.value = "";

            setTimeout(() => {
                if (text.includes("صورة") || text.includes("ارسم") || text.includes("لابسين")) {
                    createImage(text);
                } else {
                    addMessage(`أهلاً بك! لقد استلمت رسالتك: "${text}". أنا أعمل حالياً بكامل طاقتي!`, 'bot');
                }
            }, 800);
        }

        /* ===== Image studio ===== */
        function toggleStudio(show) {
            const p = $("imagePanel");
            p.hidden = show === undefined ? !p.hidden : !show;
            if (!p.hidden) $("imagePrompt").focus();
        }

        function generateFromPanel() {
            const prompt = $("imagePrompt").value.trim() || $("userInput").value.trim();
            if (!prompt) {
                $("imagePrompt").focus();
                $("imagePrompt").placeholder = "اكتب وصف الصورة أولاً...";
                return;
            }
            extractEntities(prompt);
            addMessage("أنشئ صورة: " + prompt, 'user');
            createImage(prompt);
            toggleStudio(false);
            $("imagePrompt").value = "";
            $("userInput").value = "";
        }

        function createImage(prompt) {
            const style = $("style").value, ratio = $("ratio").value;
            const [rw, rh] = ratio.split(":").map(Number);
            let width = 1024, height = 1024;
            if (rw > rh) height = Math.round(1024 * rh / rw);
            else if (rh > rw) width = Math.round(1024 * rw / rh);

            const fullPrompt = `${prompt}, ${style}, high quality, detailed composition`;
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${width}&height=${height}&nologo=true&safe=true`;

            const msg = addMessage("", 'bot');
            msg.innerHTML = '<div class="loading"><span class="spinner"></span><span>جاري توليد الصورة، قد يستغرق ذلك بعض الوقت...</span></div>';

            const img = new Image();
            img.className = "art";
            img.alt = "الصورة التي تم توليدها";
            img.referrerPolicy = "no-referrer";

            let finished = false;
            const timeout = setTimeout(() => {
                if (finished) return;
                finished = true;
                msg.textContent = "تأخر وصول الصورة. جرّب مرة أخرى أو اختصر الوصف، فقد تكون خدمة التوليد مشغولة.";
            }, 90000);

            img.onload = () => {
                if (finished) return;
                finished = true; clearTimeout(timeout);
                msg.replaceChildren();
                const label = document.createElement("div");
                label.textContent = "تم إنشاء الصورة بناءً على وصفك:";
                const actions = document.createElement("div");
                actions.className = "art-actions";
                const open = document.createElement("a");
                open.className = "small-btn"; open.href = url; open.target = "_blank"; open.rel = "noopener"; open.textContent = "فتح الصورة";
                const save = document.createElement("a");
                save.className = "small-btn"; save.href = url; save.download = "aura-image.jpg"; save.target = "_blank"; save.rel = "noopener"; save.textContent = "حفظ الصورة";
                actions.append(open, save);
                msg.append(label, img, actions);
                msg.scrollIntoView({ behavior: "smooth", block: "end" });
            };
            img.onerror = () => {
                if (finished) return;
                finished = true; clearTimeout(timeout);
                msg.textContent = "لم نتمكن من تحميل الصورة. قد تكون خدمة التوليد غير متاحة مؤقتاً؛ حاول مجدداً بعد قليل.";
            };
            img.src = url;
        }
    </script>
</body>
</html>
